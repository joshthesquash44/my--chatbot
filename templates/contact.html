<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Kodex AI</title>

    <style>
        body {
            background:   #101a2c;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        .contact-box {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: #263747;
            border-radius: 12px;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
        }

        button, .back-button {
            display: inline-block;
            padding: 12px 18px;
            background: #667aff;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Contact Kodex AI</h1>

    <div class="contact-box">
        <form action="/contact" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
            <br>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <a href="/" class="back-button">Back to Kodex AI</a>
</body>
</html>
